# 每週來源比對（CLAUDE.md §9）：來源有變動時這個工作會失敗，GitHub 通知維護者人工查證。
name: weekly-sources
on:
  schedule:
    - cron: "0 1 * * 1" # 台灣時間每週一 09:00
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - name: 監看資料來源有沒有變動
        run: node .github/scripts/watch-sources.ts
        continue-on-error: true
        id: watch
      - name: 檢查文章與比較表引用的連結
        run: node .github/scripts/check-links.ts
        id: links
        continue-on-error: true
      - name: 有任何一項需要人工查證就讓工作失敗，通知維護者
        if: steps.watch.outcome == 'failure' || steps.links.outcome == 'failure'
        run: exit 1
