# doorbell.life 錯誤頁：放在 <VirtualHost> 裡，或 Include 這個檔案。
# 範本檔由 update-templates.sh 下載到 /var/www/doorbell-life/。
# ErrorDocument 用本機路徑時，Apache 會保留原本的狀態碼。
# 需要 mod_alias；反向代理的錯誤要換頁，另需 mod_proxy。

Alias /doorbell-life/ /var/www/doorbell-life/
<Directory /var/www/doorbell-life/>
    Require all granted
</Directory>

ErrorDocument 400 /doorbell-life/400.html
ErrorDocument 401 /doorbell-life/401.html
ErrorDocument 403 /doorbell-life/403.html
ErrorDocument 404 /doorbell-life/404.html
ErrorDocument 405 /doorbell-life/405.html
ErrorDocument 408 /doorbell-life/408.html
ErrorDocument 410 /doorbell-life/410.html
ErrorDocument 414 /doorbell-life/414.html
ErrorDocument 429 /doorbell-life/429.html
ErrorDocument 500 /doorbell-life/500.html
ErrorDocument 501 /doorbell-life/501.html
ErrorDocument 502 /doorbell-life/502.html
ErrorDocument 503 /doorbell-life/503.html
ErrorDocument 504 /doorbell-life/504.html

<IfModule mod_proxy.c>
    ProxyErrorOverride On
</IfModule>
