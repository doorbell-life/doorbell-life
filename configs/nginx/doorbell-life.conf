# doorbell.life 錯誤頁：放在 server { } 裡，例如 include /etc/nginx/snippets/doorbell-life.conf;
# 範本檔由 update-templates.sh 下載到 /var/www/doorbell-life/。
# 狀態碼維持原本的值（nginx 的 error_page 不加 =code 時不改狀態碼）。

error_page 400 /doorbell-life/400.html;
error_page 401 /doorbell-life/401.html;
error_page 403 /doorbell-life/403.html;
error_page 404 /doorbell-life/404.html;
error_page 405 /doorbell-life/405.html;
error_page 408 /doorbell-life/408.html;
error_page 410 /doorbell-life/410.html;
error_page 414 /doorbell-life/414.html;
error_page 429 /doorbell-life/429.html;
error_page 500 /doorbell-life/500.html;
error_page 501 /doorbell-life/501.html;
error_page 502 /doorbell-life/502.html;
error_page 503 /doorbell-life/503.html;
error_page 504 /doorbell-life/504.html;

# 反向代理時，讓後端回傳的錯誤也換成這些頁面；後端連不上時 nginx 自己回 502、504。
proxy_intercept_errors on;
fastcgi_intercept_errors on;

location ^~ /doorbell-life/ {
    internal;
    alias /var/www/doorbell-life/;
}
